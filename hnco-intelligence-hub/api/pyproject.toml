[project]
name = "hnco-hub-api"
version = "0.1.0"
description = "HN.CO Intelligence Hub backend: central AI orchestrator, departmental agents, approvals and live events."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "openai>=1.60",
  "openai-agents>=0.6",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "azure-storage-blob>=12.24",
  "azure-identity>=1.19",
  "aiohttp>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: FastAPI's dependency injection uses Depends(...) in argument defaults by design.
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]  # E501: ruff format handles code width; long prose strings are fine
